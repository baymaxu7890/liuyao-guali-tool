# 80 端口：原六爻项目
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/liu-yao;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /liu-yao/ {
        alias /usr/share/nginx/html/liu-yao/;
        try_files $uri $uri/ /liu-yao/index.html;
    }

    location = /tool {
        return 302 /tool/;
    }

    location ^~ /tool/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /tool/index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        auth_basic "Liuyao cloud backup";
        auth_basic_user_file /etc/nginx/secrets/backup.htpasswd;

        proxy_pass http://172.17.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# 888 端口：综合排盘工具
server {
    listen 888;
    server_name localhost;

    root /usr/share/nginx/html/lytool/current;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        auth_basic "Liuyao cloud backup";
        auth_basic_user_file /etc/nginx/secrets/backup.htpasswd;

        proxy_pass http://172.17.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
