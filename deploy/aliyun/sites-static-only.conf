# 过渡配置：先切换新版静态页面，云备份接口待秘密配置完成后启用。
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html/liu-yao;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /liu-yao/ {
        alias /usr/share/nginx/html/liu-yao/;
        try_files $uri $uri/ /liu-yao/index.html;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

server {
    listen 888;
    server_name localhost;

    root /usr/share/nginx/html/lytool/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
