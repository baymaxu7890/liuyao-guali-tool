services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLOUD_BACKUP_ENABLED: "true"
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - backup-api

  backup-api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/.env
    expose:
      - "3000"
